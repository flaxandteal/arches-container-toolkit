# Included at http level via nginx.conf's `include /etc/nginx/conf.d/*.conf;`.
# The stock nginx image ships gzip commented out, so every bundle was served raw.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    application/javascript
    text/javascript
    text/css
    application/json
    image/svg+xml
    application/vnd.ms-fontobject
    font/ttf;
